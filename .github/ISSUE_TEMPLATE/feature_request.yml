name: 기능 제안
description: 개선하고 싶은 경험이나 아이디어를 알려 주세요.
title: "[제안] "
body:
  - type: markdown
    attributes:
      value: |
        공개 로드맵과 기존 이슈를 먼저 확인해 주세요. 계획 중인 기능의 세부 아이디어도 제안할 수 있습니다.
  - type: textarea
    id: problem
    attributes:
      label: 개선하고 싶은 상황
      description: 어떤 상황에서 무엇이 필요했나요?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 제안하는 사용 흐름
      description: 어떻게 사용할 수 있으면 좋을지 적어 주세요.
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: 참고 자료
      description: 관련 로드맵 항목·기존 이슈·참고 이미지나 링크가 있다면 알려 주세요.
