name: 버그 신고
description: 플레이 중 문제가 발생했을 때 알려 주세요.
title: "[버그] "
body:
  - type: markdown
    attributes:
      value: |
        기존 이슈를 먼저 확인해 주세요. 공개하고 싶지 않은 방 코드·사진·개인 정보는 포함하지 마세요.
  - type: textarea
    id: behavior
    attributes:
      label: 기대한 동작과 실제 동작
      description: 무엇을 하려 했고 어떤 문제가 생겼나요?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 재현 순서
      description: 사용한 모드·캠페인과 문제를 다시 볼 수 있는 순서를 적어 주세요.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 앱 버전
      description: 실행 중인 앱의 버전 표시를 확인해 주세요. 확인할 수 없다면 그렇게 적어 주세요.
  - type: textarea
    id: environment
    attributes:
      label: 실행 환경
      description: 기기·운영체제·브라우저 버전과 그래픽 품질을 적어 주세요.
    validations:
      required: true
  - type: textarea
    id: media
    attributes:
      label: 추가 자료
      description: 필요한 경우 스크린샷이나 짧은 영상을 첨부할 수 있습니다.
